<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Virtual</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Barra superior -->
    <div class="top-bar">Bem-vindo à nossa loja!</div>

    <!-- Seção com os nomes e categorias -->
    <div class="top-categories">
        <ul>
            <li><a href="#">Casa & Cozinha</a></li>
            <li><a href="#">Eletrônicos & Acessórios</a></li>
            <li><a href="#">Saúde & Beleza</a></li>
            <li><a href="#">Esporte & Lazer</a></li>
            <li><a href="#">Presentes</a></li>
            <li><a href="#">Infantil</a></li>
            <li><a href="#">Pet Shop</a></li>
            <li><a href="#">Sazonal</a></li>
            <li><a href="#">Novidades</a></li>
        </ul>
    </div>

    <!-- Container Header -->
    <div class="header-container">
        <input type="text" placeholder="Buscar produtos...">
        <div class="menu-icons">
            <a href="#" id="carrinho" class="carrinho-icon" onclick="toggleCarrinho()">
                <img src="img/carrinho.png" alt="Carrinho">
                <span id="qtd-carrinho">0</span>
            </a>
            <a href="https://wa.me/5511980946705" target="_blank" class="whatsapp-flutuante">
                <img src="img/whatsapp.png" alt="WhatsApp">
            </a>
        </div>
    </div>

    <div class="menu">
        <!-- Links de menu -->
    </div>

    <div class="banner">
        <img src="img/banner.jpg" alt="Banner" class="banner-img">
    </div>

    <div class="produtos" id="produtos">
        <!-- Produtos serão listados aqui -->
    </div>

    <!-- Carrinho Flutuante -->
    <div class="carrinho" id="carrinho-div">
        <h2>Meu Carrinho</h2>
        <div id="itens-carrinho"></div>
        <p id="total">Total: R$ 0.00</p>
        <button id="btn-finalizar">Finalizar Compra</button>
    </div>

    <!-- Mensagem de Confirmação -->
    <div id="mensagem-confirmacao" class="mensagem-confirmacao">
        Produto adicionado ao carrinho!
    </div>

    <footer>
        <p>&copy; 2025 Loja Virtual. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
